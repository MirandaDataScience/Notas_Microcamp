<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/boletim/boletim.css">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Permanent+Marker&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Satisfy&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">

        <div class="background">

            <div class="title-background">Cursos Matriculados</div>

             <div class="container-campos">
                
                <div class="campo" id="curso-gestao" style="display: none;">
                    <a href="/boletim/gestao/gestao.html">Gestão e Tecnologia</a>
                </div>

                <div class="campo" id="curso-hardware" style="display: none;">
                    <a href="/boletim/hardware/hardware.html">Hardware</a>
                </div>

                <div class="campo" id="curso-ingles" style="display: none;">
                    <a href="/boletim/ingles/ingles.html">Inglês</a>
                </div>

                
                <script>
                    async function carregarCursos() {
                        // Tenta recuperar o ID salvo no login
                        const idAluno = localStorage.getItem('id_aluno');
                        
                        // Se não existir, bloqueia o acesso
                        if (!idAluno || idAluno === "undefined") {
                            alert("Sessão expirada ou acesso não autorizado.");
                            window.location.href = "../aluno/aluno.html";
                            return;
                        }

                        try {
                            const response = await fetch(`http://localhost:3000/meus-cursos/${idAluno}`);
                            const cursosMatriculados = await response.json();

                            // Mapeamento de IDs do HTML para nomes que vem do Banco
                            const mapaCursos = {
                                'gestão': 'curso-gestao',
                                'hardware': 'curso-hardware',
                                'inglês': 'curso-ingles',
                                'ingles': 'curso-ingles'
                            };

                            cursosMatriculados.forEach(nomeBanco => {
                                const nomeMinusculo = nomeBanco.toLowerCase();
                                
                                // Procura se o nome do curso do banco bate com algum ID nosso
                                for (let chave in mapaCursos) {
                                    if (nomeMinusculo.includes(chave)) {
                                        const elemento = document.getElementById(mapaCursos[chave]);
                                        if (elemento) elemento.style.display = 'block';
                                    }
                                }
                            });

                            if (cursosMatriculados.length > 0) {
                                document.querySelector('.title-boletim').innerText = "Cursos disponíveis:";
                            } else {
                                document.querySelector('.title-boletim').innerText = "Nenhum curso encontrado.";
                            }

                        } catch (error) {
                            console.error("Erro ao carregar cursos:", error);
                        }
                    }

                    window.onload = carregarCursos;
                </script>


            </div>   

        </div>

        <div class="boletim">
            
            <div class="title-boletim">Selecione seu curso</div>

        </div>

    </main>

    <div class="back"><a href="/aluno/aluno.html">Voltar</a></div>

</body>
</html>
