<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="aluno.css">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Permanent+Marker&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Satisfy&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">

        <div class="background">

            <div class="title-background">Boletim do Aluno</div>
            
            <div class="login-container">

                <form action="">

                    <div class="campo">

                    <label for="user">Usuário:</label>

                    <input required type="text" id="user" name="usuario_cliente" placeholder="">

                    </div>

                    <div class="campo">

                        <label for="pass">Senha:</label>

                        <input type="password" id="pass" name="senha_cliente">

                    </div>

                    <button class="botao-entrar" type="submit">Entrar</button>

                </form>

            </div>

        </div>

    </main>

    <div class="back"><a href="/home/home.html">Voltar</a></div>
    
</body>
</html>
